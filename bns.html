<head>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
  --color-background-primary:#000;
  --color-background-secondary:#111;

  --color-text-primary:#ffffff;
  --color-text-secondary:#b3b3b3;
  --color-text-tertiary:#808080;

  --color-border-primary:#333;
  --color-border-secondary:#2a2a2a;
  --color-border-tertiary:#222;
}

body{
  font-family:var(--font-sans,"Anthropic Sans",sans-serif);
  background:var(--color-background-primary);
  color:var(--color-text-primary);
  overflow-x:hidden;
}
.wrap{
  padding:16px 12px 32px;
  max-width:1200px;
  margin:auto;
}

h1{
  font-size:clamp(18px, 4vw, 28px);
  font-weight:500;
  text-align:center;
  margin-bottom:4px;c
  olor:var(--color-text-primary)
}
.subtitle{
  font-size:clamp(11px, 2.5vw, 14px);
  color:var(--color-text-secondary);
  text-align:center;
  margin-bottom:18px
}
.toc{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:20px;padding:0 8px}
.toc-btn{
  flex:1 1 auto;
  text-align:center;
  font-size:11px;
  padding:4px 10px;
  border-radius:20px;
  border:1px solid var(--color-border-secondary);
  background:var(--color-background-secondary);
  color:var(--color-text-secondary);
  cursor:pointer;
  transition:all .2s
}
.toc-btn:hover,.toc-btn.active{background:var(--color-text-primary);color:var(--color-background-primary)}
.section{
  margin-bottom:20px;
  border-radius:12px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,0.08);
  background:#050505;
  transition:all 0.3s ease;
}
.sec-header{
  color: #622b8b;
  padding:14px;
  display:flex;
  align-items:center;
  gap:10px;
  cursor:pointer;
  user-select:none;
  position:relative;
  z-index:1;
}
.sec-label{font-size:clamp(12px, 2.5vw, 14px);font-weight:500}
.sec-meta{font-size:11px;color:var(--color-text-tertiary);margin-left:auto}
.sec-arrow{font-size:12px;color:var(--color-text-tertiary);transition:transform .2s}
.sec-arrow.open{transform:rotate(90deg)}
.sec-body{display:none;padding:0 12px 12px}
.sec-body.open{display:block}
.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(160px, 1fr));
  gap:10px;
  margin-top:10px
}
  @media (max-width:600px){
  .grid{
    grid-template-columns:1fr;
  }
}
.card{background:#0d0d0d; border-radius:8px;padding:12px;border:1px solid var(--color-border-tertiary)}
.card-title{font-size:12px;font-weight:500;margin-bottom:4px}
.card-body{font-size:11px;color:var(--color-text-secondary);line-height:1.6}
.pill{display:inline-block;font-size:10px;padding:2px 7px;border-radius:10px;margin:2px 2px 0 0;font-weight:500}
.tag-sec{color:#0C447C;background:#E6F1FB}.tag-off{color:#3B6D11;background:#EAF3DE}.tag-pen{color:#993C1D;background:#FAECE7}.tag-proc{color:#533AB7;background:#EEEDFE}.tag-new{color:#854F0B;background:#FAEEDA}

.band-blue .sec-header{background:#E6F1FB}.band-teal .sec-header{background:#E1F5EE}.band-coral .sec-header{background:#FAECE7}.band-purple .sec-header{background:#EEEDFE}.band-amber .sec-header{background:#FAEEDA}.band-green .sec-header{background:#EAF3DE}.band-pink .sec-header{background:#FBEAF0}.band-gray .sec-header{background:#F1EFE8}.band-red .sec-header{background:#FCEBEB}

.band-blue .sec-header{background:#0C447C22}.band-teal .sec-header{background:#08504122}.band-coral .sec-header{background:#71281322}.band-purple .sec-header{background:#3C348922}.band-amber .sec-header{background:#63380622}.band-green .sec-header{background:#27500A22}.band-pink .sec-header{background:#72243E22}.band-gray .sec-header{background:#44444122}.band-red .sec-header{background:#791F1F22}
.tag-sec{color:#85B7EB;background:#042C5333}.tag-off{color:#97C459;background:#17340433}.tag-pen{color:#F0997B;background:#4A1B0C33}.tag-proc{color:#AFA9EC;background:#26215C33}.tag-new{color:#FAC775;background:#41240233}
}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;justify-content:center;padding:0 8px}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--color-text-secondary)}
.dot{width:10px;height:10px;border-radius:50%}
.overview-grid{display:grid;grid-template-columns:repeat(auto-fit, minmax(120px, 1fr));gap:8px;margin-bottom:20px;padding:0 4px}
.ov-card{border-radius:8px;padding:8px 10px;border:1px solid var(--color-border-tertiary);cursor:pointer;transition:border-color .2s}
.ov-card:hover{border-color:var(--color-border-primary)}
.ov-num{font-size:18px;font-weight:500;line-height:1}
.ov-label{font-size:10px;color:var(--color-text-secondary);margin-top:2px}
/* NEON GLOW EFFECT */
.band-blue:hover{
  box-shadow:0 0 8px #00c3ff, 0 0 20px #00c3ff33;
}
.band-teal:hover{
  box-shadow:0 0 8px #00ffcc, 0 0 20px #00ffcc33;
}
.band-coral:hover{
  box-shadow:0 0 8px #ff6a3d, 0 0 20px #ff6a3d33;
}
.band-purple:hover{
  box-shadow:0 0 8px #9b7bff, 0 0 20px #9b7bff33;
}
.band-amber:hover{
  box-shadow:0 0 8px #ffb300, 0 0 20px #ffb30033;
}
.band-green:hover{
  box-shadow:0 0 8px #39ff14, 0 0 20px #39ff1433;
}
.band-pink:hover{
  box-shadow:0 0 8px #ff4da6, 0 0 20px #ff4da633;
}
.band-gray:hover{
  box-shadow:0 0 8px #aaaaaa, 0 0 20px #aaaaaa33;
}
.band-red:hover{
  box-shadow:0 0 8px #ff2e2e, 0 0 20px #ff2e2e33;
}
.floating-download{
  position:fixed;
  bottom:15px;
  right:15px;
  background:#000;
  color:#00eaff;
  border:1px solid #00eaff;
  padding:8px 12px;
  border-radius:30px;
  text-decoration:none;
  font-size:11px;
  box-shadow:0 0 10px #00eaff55;
  z-index:999;
}
@media (max-width:600px){
  .floating-download{
    left:50%;
    transform:translateX(-50%);
    right:auto;
    width:90%;
    text-align:center;
  }
}
.floating-download:hover{
  background:#00eaff;
  color:#000;
}
.hade{
  font-family: 'Playfair Display', serif;
  font-size: clamp(30px, 5vw, 56px);
  font-weight: 500;
  color: #f0c860;
  letter-spacing: -0.01em;
  line-height: 1.1;
}
@media (max-width:600px){
  .section:hover{
    box-shadow:none;
  }
}
</style>
</head>

function buildOverview(){
  const og=document.getElementById('ov-grid');
  const stats=[
    {num:"358",label:"Total Sections"},
    {num:"20",label:"Chapters"},
    {num:"1 Jul 2024",label:"In Force"},
    {num:"IPC 1860",label:"Replaced"},
    {num:"511→358",label:"Sections reduced"},
    {num:"21",label:"New offences added"},
    {num:"41",label:"Offences amended"},
    {num:"82",label:"Offences repealed"},
  ];
  stats.forEach(s=>{
    const d=document.createElement('div');
    d.className='ov-card';
    d.innerHTML=`<div class="ov-num">${s.num}</div><div class="ov-label">${s.label}</div>`;
    og.appendChild(d);
  });
}

function buildToc(){
  const tb=document.getElementById('toc-bar');
  // Add new provisions btn
  const nb=document.createElement('button');
  nb.className='toc-btn';nb.textContent='Key New Provisions';
  nb.onclick=()=>{
    document.getElementById('new-prov-wrap').style.display=
      document.getElementById('new-prov-wrap').style.display==='none'?'block':'none';
  };
  tb.appendChild(nb);
  data.forEach(ch=>{
    const b=document.createElement('button');
    b.className='toc-btn';b.textContent=ch.label.split('—')[0].trim();
    b.onclick=()=>{
  const el=document.getElementById(ch.id);

  // CLOSE all sections first
  document.querySelectorAll('.sec-body').forEach(b=>{
    b.classList.remove('open');
  });
  document.querySelectorAll('.sec-arrow').forEach(a=>{
    a.classList.remove('open');
  });

  // OPEN selected section
  const body=el.querySelector('.sec-body');
  const arr=el.querySelector('.sec-arrow');

  body.classList.add('open');
  arr.classList.add('open');

  // SCROLL after opening (better UX)
  el.scrollIntoView({behavior:'smooth',block:'start'});
};
    tb.appendChild(b);
  });
}

function buildNewProv(){
  const sw=document.getElementById('sections-wrap');
  const wrap=document.createElement('div');
  wrap.id='new-prov-wrap';
  wrap.style.display='none';
  wrap.style.marginBottom='16px';
  wrap.style.padding='12px 14px';
  wrap.style.borderRadius='10px';
  wrap.style.border='1px solid var(--color-border-secondary)';
  wrap.innerHTML=`<div style="font-size:13px;font-weight:500;margin-bottom:8px;color:var(--color-text-primary)">Key new & changed provisions</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:6px">${
    newItems.map(i=>`<div style="font-size:11px;color:var(--color-text-secondary);padding:4px 8px;border-radius:6px;border:1px solid var(--color-border-tertiary)">• ${i}</div>`).join('')
  }</div>`;
  sw.appendChild(wrap);
}

function buildSections(){
  const sw=document.getElementById('sections-wrap');
  data.forEach(ch=>{
    const sec=document.createElement('div');
    sec.className=`section band-${ch.band}`;
    sec.id=ch.id;
    sec.innerHTML=`
      <div class="sec-header" onclick="toggle('${ch.id}')">
        <div>
          <div class="sec-label">${ch.label}</div>
          <div style="font-size:11px;color:var(--color-text-secondary);margin-top:2px">${ch.desc} · Sections ${ch.secs}</div>
        </div>
        <div class="sec-meta">${ch.cards.length} topics</div>
        <span class="sec-arrow" id="arr-${ch.id}">▶</span>
      </div>
      <div class="sec-body" id="body-${ch.id}">
        <div class="grid">${ch.cards.map(c=>`<div class="card"><div class="card-title">${c.t}</div><div class="card-body">${c.b}</div></div>`).join('')}</div>
      </div>`;
    sw.appendChild(sec);
  });
}



function toggle(id){
  const allBodies = document.querySelectorAll('.sec-body');
  const allArrows = document.querySelectorAll('.sec-arrow');

  allBodies.forEach(b => {
    if(b.id !== 'body-' + id){
      b.classList.remove('open');
    }
  });

  allArrows.forEach(a => {
    if(a.id !== 'arr-' + id){
      a.classList.remove('open');
    }
  });

  // Toggle current
  const body = document.getElementById('body-' + id);
  const arr = document.getElementById('arr-' + id);

  body.classList.toggle('open');
  arr.classList.toggle('open');
}
buildOverview();
buildToc();
buildNewProv();
buildSections();
